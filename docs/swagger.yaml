          $ref: '#/definitions/UsersModels.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: ล็อกอินสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เซิร์ฟเวอร์มีปัญหา
          schema:
            additionalProperties: true
            type: object
