      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: ดึงอันดับ Leaderboard ของด่านปกติ
      tags:
      - Stage
  /stage/leaderboard/me:
    get:
      description: ดึงข้อมูลอันดับปัจจุบันของผู้เล่นในโหมดปกติ
      parameters:
      - description: User ID ของผู้เล่น
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            additionalProperties: true
            type: object
      summary: เช็คอันดับของผู้เล่นในด่านปกติ
      tags:
      - Stage
  /stage/progress:
    get:
      description: รายการด่านปกติทั้งหมดที่ผู้เล่นเคยเล่นผ่านไปแล้ว
      parameters:
      - description: User ID ของผู้เล่น
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: ดึงความคืบหน้าการเล่นด่านปกติทั้งหมด
      tags:
      - Stage
  /stage/save:
    post:
      consumes:
      - application/json
      description: บันทึกข้อมูลการเล่นจบด่าน คะแนน และดาวของผู้เล่นในโหมดปกติ
      parameters:
      - description: ข้อมูลการบันทึกด่าน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/stage.SaveStageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: บันทึกสำเร็จ
          schema:
            additionalProperties: true
            type: object
      summary: บันทึกผลการเล่นด่านปกติ
      tags:
      - Stage
  /stage/stars:
    get:
      description: ดูจำนวนดาวที่ทำได้ในแต่ละด่านของโหมดปกติ
      parameters:
      - description: User ID ของผู้เล่น
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: ดึงจำนวนดาวที่ได้ในแต่ละด่านปกติ
      tags:
      - Stage
  /stage/unlock:
    get:
      description: เช็คว่าในโหมดปกติผู้เล่นเล่นถึงด่านไหน
      parameters:
      - description: User ID ของผู้เล่น
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            additionalProperties: true
            type: object
      summary: ดึงข้อมูลด่านปกติที่ปลดล็อกล่าสุด
      tags:
      - Stage
  /users/createcharacter:
    post:
      consumes:
      - application/json
      description: ใช้สำหรับสร้างหรือตั้งค่าตัวละครของผู้เล่น
      parameters:
      - description: ข้อมูลตัวละคร
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UsersModels.CreateCharacterInput'
      produces:
      - application/json
      responses:
        "200":
          description: สร้างตัวละครสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เซิร์ฟเวอร์มีปัญหา
          schema:
            additionalProperties: true
            type: object
      summary: สร้างตัวละคร
      tags:
      - Users
  /users/data:
    get:
      description: ดึงข้อมูลโปรไฟล์ ตัวละคร และชื่อบอทของผู้เล่นปัจจุบัน
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เซิร์ฟเวอร์มีปัญหา
