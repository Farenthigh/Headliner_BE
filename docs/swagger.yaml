      - Users
  /users/login-with-google:
    post:
      description: ล็อกอินเข้าเกมผ่าน Firebase Google Auth
      produces:
      - application/json
      responses:
        "200":
          description: ล็อกอินสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: ไม่มีสิทธิ์เข้าถึง
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เซิร์ฟเวอร์มีปัญหา
          schema:
            additionalProperties: true
            type: object
      summary: Login with Google
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: ใช้สำหรับลงทะเบียนผู้ใช้ใหม่เข้าสู่ระบบ
      parameters:
      - description: ข้อมูลการสมัครสมาชิก
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UsersModels.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: สมัครสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เซิร์ฟเวอร์มีปัญหา
          schema:
            additionalProperties: true
            type: object
      summary: Register
      tags:
      - Users
  /users/register-with-google:
    post:
      description: ลงทะเบียนผู้ใช้ใหม่ผ่าน Firebase Google Auth
      produces:
      - application/json
      responses:
        "201":
          description: สมัครสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
        "401":
          description: ไม่มีสิทธิ์เข้าถึง
          schema:
            additionalProperties: true
            type: object
      summary: Register with Google
      tags:
      - Users
  /users/update-chatbot:
    post:
